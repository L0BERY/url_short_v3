name: URL_shortener_v3 CI

on:
    push:
        branches:
            - main
        paths-ignore:
            - '**/*.md'

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v5
          - name: Setup Go
            uses: actions/setup-go@v6
            with:
                go-version: '1.25.3'
                cache: true
          - name: Download dependencies
            run: go mod download
          - name: Run linter
            uses: golangci/golangci-lint-action@v9
            with:
                version: latest
                args: --timeout=5m

    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v5
          - name: Setup Go
            uses: actions/setup-go@v6
            with:
                go-version: '1.25.3'
                cache: true
          - name: Download dependencies
            run: go mod download
          - name: Run tests
            run: go test -v -race -cover -coverprofile=coverage.out ./...
          - name: Show coverage
            run: go tool cover -func=coverage.out



